<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALIBER — Dialog</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="container pad-lg">
    <p class="kicker"><a href="index.html">← Components</a></p>
    <h1>Dialog</h1>
    <p class="p1">Specimen rendered inline (no JS required).</p>
    <hr class="rule">
  </div>
  <div class="dialog-backdrop" style="position:relative;inset:auto;min-height:60vh">
    <div class="dialog" role="dialog" aria-labelledby="dlg-title">
      <div class="dialog-header">
        <div>
          <p class="kicker">Boutique appointment</p>
          <h2 id="dlg-title" style="margin:0">Request the Meridian 38?</h2>
        </div>
      </div>
      <p class="p2">A specialist will confirm the model and preferred time. Champagne marks the primary action.</p>
      <div class="dialog-actions">
        <button class="btn btn-reserve">Request appointment</button>
        <button class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
