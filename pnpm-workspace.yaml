packages:
  - "apps/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

# Patched versions for advisories that the lockfile still resolves. Each selector is
# limited to the vulnerable range, and each replacement stays on the same major
# version unless the advisory's only fix is a newer major. Remove an entry once its
# parent package ships the patched version itself.
overrides:
  "basic-ftp@>=5.0.0 <6.2.4": "^6.2.4"
  "body-parser@>=1.0.0 <1.20.9": "^1.20.9"
  "brace-expansion@>=1.0.0 <1.1.21": "^1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "ip-address@>=10.0.0 <10.7.4": "^10.7.4"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "proxy-addr@>=2.0.0 <2.0.8": "^2.0.8"
  "qs@>=6.0.0 <6.16.1": "^6.16.1"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
